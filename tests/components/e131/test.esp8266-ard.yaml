<<: !include common.yaml

light:
  - platform: neopixelbus
    name: Neopixelbus Light
    pin: 1
    type: GRBW
    variant: SK6812
    method: ESP8266_UART0
    num_leds: 256
    effects:
      - e131:
          universe: 1

# The logger shares UART0 with this test's pins, as it does on real hardware
logger:
  baud_rate: 0
